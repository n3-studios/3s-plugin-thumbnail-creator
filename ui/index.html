<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thumbnail</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; color: inherit; background: transparent; }
    h1 { font-size: 1.1rem; margin: 0 0 4px; }
    p { margin: 0 0 16px; }
    .count { font-weight: 700; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 10px 16px; min-height: 44px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 12px; min-height: 1.2em; font-size: 0.9rem; }
    #status.error { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Render thumbnails</h1>
  <p>Draws a still for <span class="count" id="summary">the selected clips</span>. Each still is a frame of the clip with its title on it.</p>

  <div class="actions">
    <button id="renderSelected" type="button">Render selected</button>
    <button id="renderAll" type="button">Render all</button>
    <button id="close" type="button">Close</button>
  </div>

  <p id="status"></p>

  <script src="app.js"></script>
</body>
</html>
