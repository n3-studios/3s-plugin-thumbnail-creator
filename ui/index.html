<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thumbnail</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; color: inherit; background: transparent; }
    .switcher { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .switcher .label { font-weight: 700; }
    .preview { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; margin-bottom: 12px; }
    .preview video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .overlay { position: absolute; left: 0; right: 0; text-align: center; padding: 0 6%; pointer-events: none;
      font-weight: 900; color: #fff; text-transform: uppercase;
      text-shadow: 0 0 4px #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .inline { flex-direction: row; align-items: center; gap: 10px; }
    label { font-weight: 700; }
    input[type="text"] { padding: 8px; border: 2px solid currentColor; background: transparent; color: inherit; min-height: 40px; font-size: 1rem; }
    input[type="range"] { width: 100%; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 10px 16px; min-height: 44px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 10px; min-height: 1.2em; font-size: 0.9rem; }
    #status.error { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>
  <div class="switcher">
    <button id="prev" type="button" aria-label="Previous clip">‹</button>
    <span class="label" id="clipLabel">Clip</span>
    <button id="next" type="button" aria-label="Next clip">›</button>
  </div>

  <div class="preview" id="preview">
    <video id="frame" muted playsinline preload="metadata"></video>
    <div class="overlay" id="titleOverlay" hidden></div>
    <div class="overlay" id="extraOverlay" hidden></div>
  </div>

  <div class="row">
    <label for="frameTime">Frame at <span id="frameLabel">0.0</span>s</label>
    <input type="range" id="frameTime" min="0" max="0" step="0.1" value="0" />
  </div>

  <div class="row inline"><input type="checkbox" id="showOverlay" /><label for="showOverlay">Draw the title</label></div>
  <div class="row inline"><input type="checkbox" id="showCaptions" /><label for="showCaptions">Show captions (burned at render)</label></div>

  <div class="row">
    <label for="extra">Extra line (thumbnail only)</label>
    <input type="text" id="extra" placeholder="Optional text drawn on the still" />
  </div>

  <p id="status"></p>

  <div class="actions">
    <button id="save" type="button">Save</button>
    <button id="renderThis" type="button">Render this</button>
    <button id="renderAll" type="button">Render all</button>
    <button id="close" type="button">Close</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
